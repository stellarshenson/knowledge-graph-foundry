[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kg_builder_cli"
version = "0.1.0"
description = "Knowledge Graph Builder for Neo4J DB (for now) heavily inspired by the Neo4J Graph Builder, with free or constrained ontology and straightforward execution"
authors = [
    { name = "Stellars Henson \u003ckonrad.jelen@gmail.com\u003e" },
]
readme = "README.md"
requires-python = "~=3.12.0"
classifiers = [
    "Programming Language :: Python :: 3",
]

dependencies = [
    "loguru",
    "tqdm",
    "typer",
    "python-dotenv",
    "botocore",
]

[project.optional-dependencies]
dev = [
    "build",
    "ipykernel",
    "ipython",
    "nbdime",
    "pip",
    "pytest",
    "pytest-cov",
    "ruff",
    "awscli",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["kg_builder_cli*"]
exclude = ["tests*"]

[tool.ruff]
line-length = 99
src = ["kg_builder_cli"]
include = ["pyproject.toml", "kg_builder_cli/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["kg_builder_cli"]
force-sort-within-sections = true
