  question: Why can't OSCAR data files be stored directly on cloud services?
  gold_answer: OSCAR data files cannot be stored directly on cloud services due to latency issues that would interfere with
    the software's proper functioning. The OSCAR software requires quick access to data files, which is best achieved when
    they are stored locally on the computer's hard drive. While users can back up their OSCAR_Data directory to cloud storage
    for safekeeping, the active data used by the software must be kept on a local drive to ensure optimal performance and
    reliability.
