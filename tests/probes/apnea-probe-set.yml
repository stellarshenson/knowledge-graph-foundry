- id: AQ29
  question: What are some strategies to reduce nasal mask irritation for new CPAP users?
  gold_answer: Several strategies can help reduce nasal mask irritation for new CPAP users. These include allowing an adjustment
    period for the skin, applying lanolin-based creams as a protective barrier, using thin hypoallergenic medical tape between
    the mask and skin, carefully adjusting the mask to reduce pressure on sensitive areas, and maintaining proper mask hygiene.
    In some cases, switching to a different mask model with a softer interface, such as the ResMed N30i, may be beneficial.
    These approaches can help minimize soreness, redness, and skin breakdown often experienced at the point of contact between
    the mask and skin.
  source_topic: New User - Sore under nose
  cluster: 72
- id: AQ30
  question: Can CPAP therapy lead to increased flatulence, and why?
  gold_answer: Yes, CPAP therapy can potentially lead to increased flatulence. This is primarily due to aerophagia, a condition
    where air is swallowed during CPAP use. The excess air in the digestive system can cause bloating, abdominal discomfort,
    and increased gas, resulting in more flatulence. To manage this side effect, patients may need to adjust their CPAP pressure
    settings or try positional therapy. If the issue persists, it's advisable to consult with a healthcare provider to optimize
    the treatment and minimize discomfort.
  source_topic: Am I understanding flatulence could be in my future?
