- id: AQ08
  question: Is OSCAR software compatible with Android devices?
  gold_answer: No, OSCAR (Open Source CPAP Analysis Reporter) is not natively compatible with Android devices. This sleep
    data analysis software is designed for use on desktop operating systems. Users who want to analyze their CPAP sleep data
    using OSCAR will need to use a compatible desktop computer rather than an Android smartphone or tablet.
  source_topic: Download onto Android
