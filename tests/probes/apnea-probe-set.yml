- id: AQ06
  question: What are some common factors that contribute to non-compliance with CPAP therapy?
  gold_answer: Several factors can contribute to non-compliance with CPAP therapy. These include mask discomfort, which can
    make it difficult for users to sleep comfortably, and side effects such as dry mouth or nasal congestion. Some individuals
    may experience claustrophobia when wearing the mask, leading to anxiety and reduced usage. Additionally, a lack of perceived
    benefit can discourage consistent use, especially if improvements in sleep quality or daytime functioning are not immediately
    noticeable.
  source_topic: New To CPAP - Need Help Finding Mask, Reliable Dealer
  cluster: 72
- id: AQ07
  question: How does a subnet mask determine if two devices are on the same network?
  gold_answer: A subnet mask determines if two devices are on the same network by defining which parts of their IP addresses
    must match. For a common subnet mask of 255.255.255.0, the first three octets of the IP addresses must be identical for
    devices to be on the same subnet. For example, devices with IP addresses 192.168.1.10 and 192.168.1.20 are on the same
    network, while 192.168.1.10 and 192.168.50.10 are not. The last octet must be unique for each device to avoid conflicts
    within the network.
  source_topic: New Router- No FlashAir anymore
