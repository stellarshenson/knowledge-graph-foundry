<!--
  pipeline_flow.svg - KGF ingestion pipeline flow diagram
  Shows: 6 pipeline stages left-to-right (Parse, Chunk, Extract, Dedup, Resolve, Load)
  connected by arrows, with 3 escalation branches (Curing, Type Resolution, Deferred Dedup)
  dropping down from their respective stages. Orange dashed return arrows show decisions
  flowing back to the pipeline.
  Intent: visualize the hot pipeline path vs agent escalation points for Section 2 of KGF_DESIGN.
  Theme: Stellars-Tech derived - fg-1=#1a5a6e (light), accent-1=#0096d1, accent-2=#da8230.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320">
  <style>
    .fg-1 { fill: #1a5a6e; }
    .fg-2 { fill: #24697e; }
    .fg-3 { fill: #236a74; }
    .fg-4 { fill: #2b7680; }
    .accent-1 { fill: #005f7a; }
    .accent-2 { fill: #7a4a15; }
    @media (prefers-color-scheme: dark) {
      .fg-1 { fill: #b8e4f0; }
      .fg-2 { fill: #8fd4e6; }
      .fg-3 { fill: #5aafc5; }
      .fg-4 { fill: #4099b3; }
      .accent-1 { fill: #5cc8e0; }
      .accent-2 { fill: #d4a04a; }
    }
  </style>

  <g id="guide-grid" display="none">
    <line x1="400" y1="0" x2="400" y2="320" stroke="red" stroke-width="0.5"/>
  </g>

  <!-- === GRID REFERENCE ===
    viewBox: 800x320
    Margin: 16px left/right, 20px top
    Pipeline row: y=20..90 (box height=50, top=20)
    Arrow row: y=45 (centre of boxes)
    Escalation row: y=160..240 (box height=60, top=170)
    Escalation connectors: y=70..170
    Box width: 100px, gap: 18px
    First box x=16, subsequent x = prev_x + 118
  === -->

  <!-- === LAYOUT TOPOLOGY ===
    h-stack: parse-box, chunk-box, extract-box, dedup-box, resolve-box, load-box (pipeline row)
    h-stack: arrows between each pair
    v-stack: extract-box > curing-box (escalation)
    v-stack: dedup-box > type-res-box (escalation)
    v-stack: resolve-box > deferred-box (escalation)
  === -->

  <!-- Title -->
  <text x="400" y="14" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="600" class="fg-2" text-anchor="middle" letter-spacing="1">INGESTION PIPELINE</text>

  <!-- === PIPELINE BOXES === -->

  <!-- Parse -->
  <g id="parse-box">
    <rect x="16" y="28" width="100" height="50" rx="6" fill="#0096d1" fill-opacity="0.06" stroke="#0096d1" stroke-width="1.2"/>
    <rect x="16" y="28" width="100" height="4" rx="2" fill="#0096d1" opacity="0.5"/>
    <text x="66" y="52" class="fg-1" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Parse</text>
    <text x="66" y="66" class="fg-3" font-family="Segoe UI, Arial, sans-serif" font-size="8" text-anchor="middle">PDF, TXT, JSON</text>
  </g>

  <!-- Arrow 1 -->
  <line x1="118" y1="53" x2="132" y2="53" stroke="#0096d1" stroke-width="1.5" opacity="0.3"/>
  <polygon points="132,49 140,53 132,57" fill="#0096d1" opacity="0.7"/>

  <!-- Chunk -->
  <g id="chunk-box">
    <rect x="142" y="28" width="100" height="50" rx="6" fill="#0096d1" fill-opacity="0.06" stroke="#0096d1" stroke-width="1.2"/>
    <rect x="142" y="28" width="100" height="4" rx="2" fill="#0096d1" opacity="0.5"/>
    <text x="192" y="52" class="fg-1" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Chunk</text>
    <text x="192" y="66" class="fg-3" font-family="Segoe UI, Arial, sans-serif" font-size="8" text-anchor="middle">Token windows</text>
  </g>

  <!-- Arrow 2 -->
  <line x1="244" y1="53" x2="258" y2="53" stroke="#0096d1" stroke-width="1.5" opacity="0.3"/>
  <polygon points="258,49 266,53 258,57" fill="#0096d1" opacity="0.7"/>

  <!-- Extract -->
  <g id="extract-box">
    <rect x="268" y="28" width="100" height="50" rx="6" fill="#0096d1" fill-opacity="0.06" stroke="#0096d1" stroke-width="1.2"/>
    <rect x="268" y="28" width="100" height="4" rx="2" fill="#0096d1" opacity="0.5"/>
    <text x="318" y="52" class="fg-1" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Extract</text>
    <text x="318" y="66" class="fg-3" font-family="Segoe UI, Arial, sans-serif" font-size="8" text-anchor="middle">litellm+instructor</text>
  </g>

  <!-- Arrow 3 -->
  <line x1="370" y1="53" x2="384" y2="53" stroke="#0096d1" stroke-width="1.5" opacity="0.3"/>
  <polygon points="384,49 392,53 384,57" fill="#0096d1" opacity="0.7"/>

  <!-- Dedup -->
  <g id="dedup-box">
    <rect x="394" y="28" width="100" height="50" rx="6" fill="#0096d1" fill-opacity="0.06" stroke="#0096d1" stroke-width="1.2"/>
    <rect x="394" y="28" width="100" height="4" rx="2" fill="#0096d1" opacity="0.5"/>
    <text x="444" y="52" class="fg-1" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Dedup</text>
    <text x="444" y="66" class="fg-3" font-family="Segoe UI, Arial, sans-serif" font-size="8" text-anchor="middle">Embedding + rules</text>
  </g>

  <!-- Arrow 4 -->
  <line x1="496" y1="53" x2="510" y2="53" stroke="#0096d1" stroke-width="1.5" opacity="0.3"/>
  <polygon points="510,49 518,53 510,57" fill="#0096d1" opacity="0.7"/>

  <!-- Resolve -->
  <g id="resolve-box">
    <rect x="520" y="28" width="100" height="50" rx="6" fill="#0096d1" fill-opacity="0.06" stroke="#0096d1" stroke-width="1.2"/>
    <rect x="520" y="28" width="100" height="4" rx="2" fill="#0096d1" opacity="0.5"/>
    <text x="570" y="52" class="fg-1" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Resolve</text>
    <text x="570" y="66" class="fg-3" font-family="Segoe UI, Arial, sans-serif" font-size="8" text-anchor="middle">Cross-type merge</text>
  </g>

  <!-- Arrow 5 -->
  <line x1="622" y1="53" x2="636" y2="53" stroke="#0096d1" stroke-width="1.5" opacity="0.3"/>
  <polygon points="636,49 644,53 636,57" fill="#0096d1" opacity="0.7"/>

  <!-- Load -->
  <g id="load-box">
    <rect x="646" y="28" width="100" height="50" rx="6" fill="#0096d1" fill-opacity="0.06" stroke="#0096d1" stroke-width="1.2"/>
    <rect x="646" y="28" width="100" height="4" rx="2" fill="#0096d1" opacity="0.5"/>
    <text x="696" y="52" class="fg-1" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Load</text>
    <text x="696" y="66" class="fg-3" font-family="Segoe UI, Arial, sans-serif" font-size="8" text-anchor="middle">Batch Cypher</text>
  </g>

  <!-- Neo4J target -->
  <line x1="748" y1="53" x2="762" y2="53" stroke="#0096d1" stroke-width="1.5" opacity="0.3"/>
  <polygon points="762,49 770,53 762,57" fill="#0096d1" opacity="0.7"/>
  <!-- Database cylinder -->
  <ellipse cx="784" cy="43" rx="12" ry="5" fill="none" stroke="#0096d1" stroke-width="1.2"/>
  <path d="M772,43 V63 A12,5 0 0 0 796,63 V43" fill="#0096d1" fill-opacity="0.06" stroke="#0096d1" stroke-width="1.2"/>
  <ellipse cx="784" cy="63" rx="12" ry="5" fill="none" stroke="#0096d1" stroke-width="1.2"/>
  <text x="784" y="56" class="fg-1" font-family="Segoe UI, Arial, sans-serif" font-size="7" text-anchor="middle">Neo4J</text>

  <!-- === ESCALATION LABEL === -->
  <text x="400" y="108" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="600" class="accent-2" text-anchor="middle" letter-spacing="1">ESCALATION AGENTS (STRANDS SDK)</text>
  <line x1="120" y1="113" x2="680" y2="113" stroke="#da8230" stroke-width="0.5" opacity="0.3"/>

  <!-- === ESCALATION BOXES === -->

  <!-- Curing Agent - drops from between Extract and Dedup -->
  <g id="curing-box">
    <line x1="318" y1="78" x2="318" y2="130" stroke="#da8230" stroke-width="1.2" stroke-dasharray="4,3"/>
    <polygon points="314,130 318,138 322,130" fill="#da8230" opacity="0.7"/>
    <rect x="218" y="140" width="200" height="70" rx="6" fill="#da8230" fill-opacity="0.06" stroke="#da8230" stroke-width="1.2"/>
    <rect x="218" y="140" width="200" height="4" rx="2" fill="#da8230" opacity="0.5"/>
    <text x="318" y="162" class="fg-1" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Curing Agent</text>
    <text x="318" y="176" class="fg-3" font-family="Segoe UI, Arial, sans-serif" font-size="8" text-anchor="middle">Metrics timeline + type frequencies</text>
    <text x="318" y="190" class="fg-4" font-family="Segoe UI, Arial, sans-serif" font-size="8" text-anchor="middle">Returns CureDecision (cure/block)</text>
    <text x="318" y="204" font-family="Segoe UI, Arial, sans-serif" font-size="7" class="accent-2">query_graph / query_buffer / inspect_metrics</text>
  </g>

  <!-- Type Resolution Agent - drops from Dedup -->
  <g id="type-res-box">
    <line x1="444" y1="78" x2="444" y2="222" stroke="#da8230" stroke-width="1.2" stroke-dasharray="4,3"/>
    <polygon points="440,222 444,230 448,222" fill="#da8230" opacity="0.7"/>
    <rect x="344" y="232" width="200" height="70" rx="6" fill="#da8230" fill-opacity="0.06" stroke="#da8230" stroke-width="1.2"/>
    <rect x="344" y="232" width="200" height="4" rx="2" fill="#da8230" opacity="0.5"/>
    <text x="444" y="254" class="fg-1" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Resolution Agent</text>
    <text x="444" y="268" class="fg-3" font-family="Segoe UI, Arial, sans-serif" font-size="8" text-anchor="middle">Bayesian posterior + candidate pairs</text>
    <text x="444" y="282" class="fg-4" font-family="Segoe UI, Arial, sans-serif" font-size="8" text-anchor="middle">Returns TypeChoice / MergeDecision</text>
    <text x="444" y="296" font-family="Segoe UI, Arial, sans-serif" font-size="7" class="accent-2">query_graph / query_buffer</text>
  </g>

  <!-- Deferred Dedup Agent - drops from Resolve -->
  <g id="deferred-box">
    <line x1="570" y1="78" x2="570" y2="130" stroke="#da8230" stroke-width="1.2" stroke-dasharray="4,3"/>
    <polygon points="566,130 570,138 574,130" fill="#da8230" opacity="0.7"/>
    <rect x="470" y="140" width="200" height="70" rx="6" fill="#da8230" fill-opacity="0.06" stroke="#da8230" stroke-width="1.2"/>
    <rect x="470" y="140" width="200" height="4" rx="2" fill="#da8230" opacity="0.5"/>
    <text x="570" y="162" class="fg-1" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Deferred Dedup</text>
    <text x="570" y="176" class="fg-3" font-family="Segoe UI, Arial, sans-serif" font-size="8" text-anchor="middle">Ambiguous zone (0.4-0.6 posterior)</text>
    <text x="570" y="190" class="fg-4" font-family="Segoe UI, Arial, sans-serif" font-size="8" text-anchor="middle">Returns CrossTypeMergeDecision</text>
    <text x="570" y="204" font-family="Segoe UI, Arial, sans-serif" font-size="7" class="accent-2">query_graph / query_buffer</text>
  </g>

  <!-- Legend -->
  <g id="legend">
    <line x1="16" y1="310" x2="36" y2="310" stroke="#0096d1" stroke-width="1.5"/>
    <text x="40" y="313" class="fg-4" font-family="Segoe UI, Arial, sans-serif" font-size="8">Pipeline (direct litellm+instructor)</text>
    <line x1="220" y1="310" x2="240" y2="310" stroke="#da8230" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="244" y="313" class="fg-4" font-family="Segoe UI, Arial, sans-serif" font-size="8">Agent escalation (Strands SDK)</text>
  </g>

</svg>
