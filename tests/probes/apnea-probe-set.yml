- id: AQ13
  question: What are some common causes of the "No supported data found" error in OSCAR software?
  gold_answer: The "No supported data found" error in OSCAR software can occur due to several reasons. These include file
    format incompatibility between the CPAP machine and OSCAR, selecting the wrong folder during data import, operating system
    compatibility issues (especially for Mac OS users), and potential data corruption. This error essentially means that OSCAR
    is unable to recognize or locate the CPAP data files on the storage medium, such as an SD card, during the import process.
  source_topic: no supported data was found
