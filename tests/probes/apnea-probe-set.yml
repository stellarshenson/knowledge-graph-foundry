- id: AQ12
  question: Why might CPAP devices have weaker wireless signal strength compared to cell phones?
  gold_answer: CPAP devices may have weaker wireless signal strength compared to cell phones due to differences in design
    priorities and target users. CPAP manufacturers often focus primarily on ensuring compliance data transmission to Durable
    Medical Equipment (DME) providers, rather than optimizing connectivity for patient use. This approach can result in less
    robust wireless capabilities in CPAP devices compared to consumer electronics like smartphones, which are designed with
    strong connectivity as a key feature.
  source_topic: ResMed Stonewalling Legitimate Question on MyAir
