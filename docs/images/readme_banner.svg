<!--
  readme_banner.svg - KGF README header banner
  Shows: title, tagline, and decorative accent bar with graph-node motif.
  Theme: Stellars-Tech derived - teal/cyan primary, orange accent.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 90">
  <style>
    .fg-1 { fill: #1a5a6e; }
    .fg-2 { fill: #24697e; }
    .fg-3 { fill: #236a74; }
    @media (prefers-color-scheme: dark) {
      .fg-1 { fill: #b8e4f0; }
      .fg-2 { fill: #8fd4e6; }
      .fg-3 { fill: #5aafc5; }
    }
  </style>
  <defs>
    <linearGradient id="accent_bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0" stop-color="#0096d1"/>
      <stop offset="0.6" stop-color="#0096d1"/>
      <stop offset="1" stop-color="#da8230"/>
    </linearGradient>
  </defs>

  <!-- Bottom accent gradient bar -->
  <rect x="0" y="80" width="800" height="10" fill="url(#accent_bar)" opacity="0.6"/>

  <!-- Title -->
  <text x="40" y="34" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" class="fg-1">Knowledge Graph Foundry</text>

  <!-- Tagline -->
  <text x="40" y="60" font-family="Segoe UI, Arial, sans-serif" font-size="12" class="fg-3">CLI tool for building knowledge graphs in Neo4j from documents and structured data</text>

  <!-- Decorative graph nodes (right side) -->
  <g opacity="0.35">
    <circle cx="700" cy="36" r="10" fill="none" stroke="#0096d1" stroke-width="1.8"/>
    <circle cx="700" cy="36" r="3" fill="#0096d1" opacity="0.4"/>
    <circle cx="740" cy="18" r="7" fill="none" stroke="#0096d1" stroke-width="1.4"/>
    <circle cx="740" cy="18" r="2" fill="#0096d1" opacity="0.4"/>
    <circle cx="748" cy="54" r="6" fill="none" stroke="#da8230" stroke-width="1.4"/>
    <circle cx="748" cy="54" r="2" fill="#da8230" opacity="0.4"/>
    <circle cx="660" cy="48" r="8" fill="none" stroke="#0096d1" stroke-width="1.4"/>
    <circle cx="660" cy="48" r="2.5" fill="#0096d1" opacity="0.4"/>
    <circle cx="668" cy="20" r="5" fill="none" stroke="#da8230" stroke-width="1.2"/>
    <circle cx="668" cy="20" r="1.5" fill="#da8230" opacity="0.4"/>
    <line x1="709" y1="30" x2="734" y2="22" stroke="#0096d1" stroke-width="1"/>
    <line x1="708" y1="42" x2="743" y2="50" stroke="#da8230" stroke-width="1"/>
    <line x1="691" y1="40" x2="667" y2="44" stroke="#0096d1" stroke-width="1"/>
    <line x1="694" y1="29" x2="672" y2="23" stroke="#da8230" stroke-width="1"/>
    <line x1="664" y1="25" x2="658" y2="41" stroke="#0096d1" stroke-width="0.8"/>
  </g>

</svg>
