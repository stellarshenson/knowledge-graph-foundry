  question: How often should CPAP mask cushions be replaced and why?
  gold_answer: CPAP mask cushions should typically be replaced after about 12 months of use, or sooner if needed. Regular
    replacement is necessary because skin oils can degrade the cushion over time, leading to poor sealing and increased air
    leakage. A cushion used for a year may no longer provide an adequate seal, compromising therapy effectiveness. Following
    manufacturer guidelines for replacement schedules helps maintain proper mask fit, reduce leakage, and ensure optimal CPAP
    therapy performance.
  source_topic: Mask Usage , in particular Mask Leakage
