<!--
  theme_swatch.svg - KGF palette derived from Stellars-Tech JupyterHub logo
  Shows: all shade grades (fg-1 to fg-4, accent-1/2, bg-1/2) across three sections:
  transparent background (palette reference), light strip (#f5f7fa), dark strip (#1e1e1e).
  Intent: validate KGF infographic palette before producing deliverables.
  Theme: Stellars-Tech derived - teal/cyan primary, orange accent.
  fg-1 = most contrastive (brightest), fg-4 = least contrastive (still readable).
  Source: stellars-tech_jupyterhub_logo_basic.svg brand colours #4099b3, #0096d1, #da8230.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520">
  <style>
    .fg-1 { fill: #b8e4f0; }
    .fg-2 { fill: #8fd4e6; }
    .fg-3 { fill: #5aafc5; }
    .fg-4 { fill: #4099b3; }
    .accent-1 { fill: #0096d1; }
    .accent-2 { fill: #da8230; }
    .on-fill { fill: #e0f2f7; }
    @media (prefers-color-scheme: dark) {
      .fg-1 { fill: #b8e4f0; }
      .fg-2 { fill: #8fd4e6; }
      .fg-3 { fill: #5aafc5; }
      .fg-4 { fill: #4099b3; }
      .on-fill { fill: #e0f2f7; }
    }
  </style>

  <g id="guide-grid" display="none">
    <line x1="0" y1="0" x2="800" y2="0" stroke="red" stroke-width="0.5"/>
    <line x1="400" y1="0" x2="400" y2="520" stroke="red" stroke-width="0.5"/>
    <line x1="0" y1="520" x2="800" y2="520" stroke="red" stroke-width="0.5"/>
  </g>

  <!-- === GRID REFERENCE ===
    viewBox: 800x520
    Margin: 20px all sides
    Palette section: y=0..150
    Light strip: y=166..330
    Dark strip: y=346..510
    Columns: left=20, mid=400, right=780
    Vertical rhythm: 14px base
  === -->

  <!-- === LAYOUT TOPOLOGY ===
    v-stack: palette-ref, light-strip, dark-strip
    mirror: light-strip, dark-strip (identical internal layout)
    contain: light-strip > card, stats, arrows, icon-samples, coverage-bar
    contain: dark-strip > card, stats, arrows, icon-samples, coverage-bar
  === -->

  <!-- === SECTION 1: Palette Reference (transparent bg) === -->
  <g id="palette-ref">
    <text x="20" y="20" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="600" fill="#5aafc5" letter-spacing="1">KGF THEME SWATCH (STELLARS-TECH DERIVED)</text>
    <line x1="20" y1="26" x2="780" y2="26" stroke="#5aafc5" stroke-width="0.5" opacity="0.3"/>

    <!-- Foreground shades: fg-1 = most contrastive, fg-4 = least -->
    <text x="20" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="8" fill="#5aafc5" letter-spacing="1">FOREGROUND SHADES (1=MOST CONTRASTIVE, 4=LEAST)</text>
    <rect x="20" y="54" width="12" height="12" rx="2" fill="#b8e4f0"/>
    <text x="38" y="65" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#b8e4f0">fg-1 - Headings, primary labels (most visible)</text>
    <rect x="20" y="74" width="12" height="12" rx="2" fill="#8fd4e6"/>
    <text x="38" y="85" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#8fd4e6">fg-2 - Card titles, stat numbers</text>
    <rect x="20" y="94" width="12" height="12" rx="2" fill="#5aafc5"/>
    <text x="38" y="105" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#5aafc5">fg-3 - Descriptions, sublabels</text>
    <rect x="20" y="114" width="12" height="12" rx="2" fill="#4099b3"/>
    <text x="38" y="125" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#4099b3">fg-4 - Metadata, tertiary (least visible, still readable)</text>

    <!-- Accent shades -->
    <text x="530" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="8" fill="#5aafc5" letter-spacing="1">ACCENT SHADES</text>
    <rect x="530" y="56" width="90" height="26" rx="6" fill="#0096d1"/>
    <text x="530" y="98" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#5aafc5">accent-1: #0096d1</text>
    <rect x="650" y="56" width="90" height="26" rx="6" fill="#da8230"/>
    <text x="650" y="98" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#5aafc5">accent-2: #da8230</text>

    <!-- Background fills -->
    <text x="530" y="116" font-family="Segoe UI, Arial, sans-serif" font-size="8" fill="#5aafc5" letter-spacing="1">BACKGROUND FILLS</text>
    <rect x="530" y="120" width="90" height="14" rx="4" fill="#0096d1" fill-opacity="0.06" stroke="#0096d1" stroke-width="1"/>
    <text x="540" y="131" font-family="Segoe UI, Arial, sans-serif" font-size="7" fill="#5aafc5">bg-1 (0.06)</text>
    <rect x="650" y="120" width="90" height="14" rx="4" fill="#0096d1" opacity="0.3"/>
    <text x="660" y="131" font-family="Segoe UI, Arial, sans-serif" font-size="7" fill="#5aafc5">bg-2 (0.3)</text>

    <!-- Stroke reference -->
    <text x="530" y="148" font-family="Segoe UI, Arial, sans-serif" font-size="8" fill="#5aafc5" letter-spacing="1">STROKE REF: #1278d1</text>
    <line x1="670" y1="144" x2="740" y2="144" stroke="#1278d1" stroke-width="2"/>
  </g>

  <!-- === SECTION 2: Light background strip === -->
  <g id="light-strip">
    <rect x="0" y="166" width="800" height="164" fill="#f5f7fa"/>
    <text x="20" y="186" font-family="Segoe UI, Arial, sans-serif" font-size="8" fill="#2e808e" letter-spacing="1">ON LIGHT BACKGROUND (#f5f7fa)</text>

    <!-- Card sample -->
    <g id="card-light">
      <path d="M20,196 H195 V290 Q195,300 185,300 H30 Q20,300 20,290 Z" fill="#0096d1" opacity="0.04"/>
      <path d="M20,196 H195 V290 Q195,300 185,300 H30 Q20,300 20,290 Z" fill="none" stroke="#0096d1" stroke-width="1"/>
      <rect x="20" y="196" width="175" height="5" fill="#0096d1" opacity="0.6"/>
      <text x="32" y="218" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" fill="#0096d1">EXTRACT</text>
      <text x="32" y="236" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#1a5a6e">Entity Extraction</text>
      <text x="32" y="254" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#24697e">litellm + instructor</text>
      <text x="32" y="268" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#2e808e">Pydantic structured output</text>
      <text x="32" y="282" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#3a929e">8 LLM call sites</text>
    </g>

    <!-- Stat sample -->
    <g id="stats-light">
      <text x="220" y="216" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#1a5a6e">1,007</text>
      <text x="220" y="232" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#2e808e">Entities</text>
      <line x1="300" y1="204" x2="300" y2="236" stroke="#0096d1" stroke-width="1" opacity="0.3"/>
      <text x="320" y="216" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#1a5a6e">3,496</text>
      <text x="320" y="232" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#2e808e">Relationships</text>
      <line x1="410" y1="204" x2="410" y2="236" stroke="#0096d1" stroke-width="1" opacity="0.3"/>
      <text x="430" y="216" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#da8230">88%</text>
      <text x="430" y="232" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#2e808e">Hybrid Score</text>
    </g>

    <!-- Arrow samples -->
    <g id="arrows-light">
      <text x="560" y="200" font-family="Segoe UI, Arial, sans-serif" font-size="8" fill="#2e808e" letter-spacing="1">ARROWS</text>
      <line x1="560" y1="214" x2="620" y2="214" stroke="#0096d1" stroke-width="2" opacity="0.3"/>
      <polygon points="620,209 630,214 620,219" fill="#0096d1" opacity="0.8"/>
      <text x="640" y="218" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#24697e">pipeline flow</text>
      <line x1="560" y1="234" x2="620" y2="234" stroke="#da8230" stroke-width="2" opacity="0.3"/>
      <polygon points="620,229 630,234 620,239" fill="#da8230" opacity="0.8"/>
      <text x="640" y="238" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#24697e">escalation</text>
      <line x1="560" y1="254" x2="620" y2="254" stroke="#0096d1" stroke-width="1.5" stroke-dasharray="4,3"/>
      <polygon points="620,249 630,254 620,259" fill="#0096d1" opacity="0.5"/>
      <text x="640" y="258" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#24697e">decision return</text>
    </g>

    <!-- Icon stroke samples -->
    <g id="icons-light">
      <text x="560" y="280" font-family="Segoe UI, Arial, sans-serif" font-size="8" fill="#2e808e" letter-spacing="1">ICON STROKES</text>
      <circle cx="574" cy="298" r="6" fill="#0096d1" fill-opacity="0.06" stroke="#0096d1" stroke-width="1.5"/>
      <circle cx="594" cy="290" r="4" fill="#0096d1" fill-opacity="0.06" stroke="#0096d1" stroke-width="1.5"/>
      <line x1="579" y1="294" x2="590" y2="292" stroke="#0096d1" stroke-width="1"/>
      <circle cx="594" cy="306" r="4" fill="#da8230" fill-opacity="0.06" stroke="#da8230" stroke-width="1.5"/>
      <line x1="579" y1="302" x2="590" y2="304" stroke="#da8230" stroke-width="1"/>
      <rect x="620" y="288" width="40" height="6" rx="2" fill="#0096d1" fill-opacity="0.15"/>
      <rect x="620" y="298" width="30" height="6" rx="2" fill="#0096d1" fill-opacity="0.25"/>
      <rect x="620" y="308" width="50" height="6" rx="2" fill="#da8230" fill-opacity="0.2"/>
    </g>

    <!-- Coverage bar -->
    <g id="coverage-light">
      <text x="220" y="260" font-family="Segoe UI, Arial, sans-serif" font-size="8" fill="#2e808e" letter-spacing="1">COVERAGE BAR</text>
      <rect x="220" y="268" width="260" height="14" rx="4" fill="#0096d1" fill-opacity="0.08"/>
      <rect x="220" y="268" width="229" height="14" rx="4" fill="#0096d1"/>
      <text x="340" y="279" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="600" fill="#f5f7fa">88%</text>
    </g>

    <!-- Light mode note -->
    <text x="20" y="322" font-family="Segoe UI, Arial, sans-serif" font-size="8" fill="#3a929e">Light mode uses darker variants: fg-1=#1a5a6e fg-2=#24697e fg-3=#2e808e fg-4=#3a929e</text>
  </g>

  <!-- === SECTION 3: Dark background strip === -->
  <g id="dark-strip">
    <rect x="0" y="346" width="800" height="174" fill="#1e1e1e"/>
    <text x="20" y="366" font-family="Segoe UI, Arial, sans-serif" font-size="8" fill="#9ad4e2" letter-spacing="1">ON DARK BACKGROUND (#1e1e1e)</text>

    <!-- Card sample (dark) -->
    <g id="card-dark">
      <path d="M20,376 H195 V470 Q195,480 185,480 H30 Q20,480 20,470 Z" fill="#0096d1" opacity="0.08"/>
      <path d="M20,376 H195 V470 Q195,480 185,480 H30 Q20,480 20,470 Z" fill="none" stroke="#0096d1" stroke-width="1" opacity="0.5"/>
      <rect x="20" y="376" width="175" height="5" fill="#0096d1" opacity="0.6"/>
      <text x="32" y="398" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" fill="#0096d1">EXTRACT</text>
      <text x="32" y="416" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#b8e4f0">Entity Extraction</text>
      <text x="32" y="434" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#8fd4e6">litellm + instructor</text>
      <text x="32" y="448" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#5aafc5">Pydantic structured output</text>
      <text x="32" y="462" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#4099b3">8 LLM call sites</text>
    </g>

    <!-- Stat sample (dark) -->
    <g id="stats-dark">
      <text x="220" y="396" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#b8e4f0">1,007</text>
      <text x="220" y="412" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#5aafc5">Entities</text>
      <line x1="300" y1="384" x2="300" y2="416" stroke="#0096d1" stroke-width="1" opacity="0.3"/>
      <text x="320" y="396" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#b8e4f0">3,496</text>
      <text x="320" y="412" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#5aafc5">Relationships</text>
      <line x1="410" y1="384" x2="410" y2="416" stroke="#0096d1" stroke-width="1" opacity="0.3"/>
      <text x="430" y="396" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#da8230">88%</text>
      <text x="430" y="412" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#5aafc5">Hybrid Score</text>
    </g>

    <!-- Arrow samples (dark) -->
    <g id="arrows-dark">
      <text x="560" y="380" font-family="Segoe UI, Arial, sans-serif" font-size="8" fill="#9ad4e2" letter-spacing="1">ARROWS</text>
      <line x1="560" y1="394" x2="620" y2="394" stroke="#0096d1" stroke-width="2" opacity="0.5"/>
      <polygon points="620,389 630,394 620,399" fill="#0096d1" opacity="0.8"/>
      <text x="640" y="398" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#8fd4e6">pipeline flow</text>
      <line x1="560" y1="414" x2="620" y2="414" stroke="#da8230" stroke-width="2" opacity="0.5"/>
      <polygon points="620,409 630,414 620,419" fill="#da8230" opacity="0.8"/>
      <text x="640" y="418" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#8fd4e6">escalation</text>
      <line x1="560" y1="434" x2="620" y2="434" stroke="#0096d1" stroke-width="1.5" stroke-dasharray="4,3"/>
      <polygon points="620,429 630,434 620,439" fill="#0096d1" opacity="0.5"/>
      <text x="640" y="438" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#8fd4e6">decision return</text>
    </g>

    <!-- Icon stroke samples (dark) -->
    <g id="icons-dark">
      <text x="560" y="460" font-family="Segoe UI, Arial, sans-serif" font-size="8" fill="#9ad4e2" letter-spacing="1">ICON STROKES</text>
      <circle cx="574" cy="478" r="6" fill="#0096d1" fill-opacity="0.1" stroke="#0096d1" stroke-width="1.5"/>
      <circle cx="594" cy="470" r="4" fill="#0096d1" fill-opacity="0.1" stroke="#0096d1" stroke-width="1.5"/>
      <line x1="579" y1="474" x2="590" y2="472" stroke="#0096d1" stroke-width="1"/>
      <circle cx="594" cy="486" r="4" fill="#da8230" fill-opacity="0.1" stroke="#da8230" stroke-width="1.5"/>
      <line x1="579" y1="482" x2="590" y2="484" stroke="#da8230" stroke-width="1"/>
      <rect x="620" y="468" width="40" height="6" rx="2" fill="#0096d1" fill-opacity="0.3"/>
      <rect x="620" y="478" width="30" height="6" rx="2" fill="#0096d1" fill-opacity="0.4"/>
      <rect x="620" y="488" width="50" height="6" rx="2" fill="#da8230" fill-opacity="0.3"/>
    </g>

    <!-- Coverage bar (dark) -->
    <g id="coverage-dark">
      <text x="220" y="440" font-family="Segoe UI, Arial, sans-serif" font-size="8" fill="#9ad4e2" letter-spacing="1">COVERAGE BAR</text>
      <rect x="220" y="448" width="260" height="14" rx="4" fill="#0096d1" fill-opacity="0.12"/>
      <rect x="220" y="448" width="229" height="14" rx="4" fill="#0096d1"/>
      <text x="340" y="459" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="600" fill="#e0f2f7">88%</text>
    </g>

    <!-- Dark mode note -->
    <text x="20" y="506" font-family="Segoe UI, Arial, sans-serif" font-size="8" fill="#4099b3">Dark mode uses CSS classes: fg-1=#b8e4f0 fg-2=#8fd4e6 fg-3=#5aafc5 fg-4=#4099b3</text>
  </g>

</svg>
