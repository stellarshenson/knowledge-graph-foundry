- id: AQ18
  question: Where does OSCAR typically store user data on a computer?
  gold_answer: OSCAR typically stores user data in the "~/Documents/OSCAR_Data" directory on the user's computer. This location
    is where CPAP data imported from SD cards or other sources is saved for analysis. Checking this directory can be helpful
    when troubleshooting data import issues or unexpected software behavior.
