- id: AQ22
  question: What are some troubleshooting steps for missing data in OSCAR software?
  gold_answer: To troubleshoot missing data in OSCAR software, users can try several steps. First, verify that all relevant
    waveforms are selected in OSCAR's preferences under File > Preferences > Waveforms. Next, ensure the correct CPAP device
    is selected in OSCAR's device profile. If data is still missing, reformat the SD card and allow the CPAP machine to record
    data for several nights before reimporting it into OSCAR. This process can help determine if the issue is due to data
    corruption or device incompatibility.
  source_topic: OSCAR - No data summary only
