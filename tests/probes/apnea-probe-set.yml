probes:
- id: AQ01
  question: Why might a home sleep study be insufficient for diagnosing Upper Airway Resistance Syndrome (UARS)?
  gold_answer: Home sleep studies may be insufficient for diagnosing Upper Airway Resistance Syndrome (UARS) because they
    typically focus on measuring the Apnea-Hypopnea Index (AHI), which may not capture the full spectrum of sleep-disordered
    breathing. UARS is characterized by Respiratory Effort-Related Arousals (RERAs), which indicate flow limitations leading
    to arousals. These RERAs are often not measured in home sleep studies. Consequently, individuals with UARS may show a
    low AHI but still experience persistent symptoms, necessitating further evaluation through in-lab polysomnography to accurately
    assess RERAs and other sleep disturbances.
  source_topic: Do I have UARS?
  cluster: 14
- id: AQ02
  question: How does high altitude affect CPAP therapy, and what adjustments might be necessary?
  gold_answer: High altitude can impact CPAP therapy due to decreased absolute air pressure. While CPAP devices typically
    compensate for altitude changes up to about 8000 feet, adjustments may be necessary above this level. Some users report
    increased Central Apnea events at high altitudes. Possible adjustments include reducing pressure support (PS) and minimum
    pressure. Self-titration skills are valuable for CPAP users traveling to high-altitude locations, as they may need to
    fine-tune their settings for optimal therapy effectiveness.
  source_topic: xPAP setting changes at high altitudes (above 8000 feet)?
  cluster: 3
- id: AQ03
  question: How do replacement frequencies differ between nasal pillows and other CPAP mask components?
  gold_answer: Replacement frequencies for CPAP mask components vary, with nasal pillows typically requiring more frequent
    replacement than other parts. Nasal pillows are often replaced every 6 to 9 months due to their direct face contact and
    wear. In contrast, mask frames and tubing are usually replaced less frequently, with some users changing them every few
    months to annually or even longer. The replacement schedule depends on individual usage, care practices, and visible wear.
    Some users employ a rotation system for nasal pillows to extend their lifespan.
  source_topic: Nasal Pillow P10 mask cleaning question
  cluster: 80
- id: AQ04
  question: What are the key recommendations for individuals using CPAP therapy while wearing braces?
  gold_answer: 'For individuals using CPAP therapy while wearing braces, key recommendations include: 1) Consulting with both
    a dentist/orthodontist and sleep medicine physician to address potential interactions. 2) Exploring different CPAP mask
    types to find one that fits comfortably and securely with braces. 3) Adjusting CPAP mask straps to avoid excessive pressure
    on the braces. 4) Considering the use of dental wax or other protective materials to minimize irritation from braces.
    These steps can help ensure effective CPAP therapy while maintaining orthodontic treatment.'
  source_topic: CPAP and braces
  cluster: 38
- id: AQ05
  question: What types of sleep apnea metrics can be analyzed using tools like SleepyHead?
  gold_answer: Sleep data analysis tools like SleepyHead allow CPAP users to examine various sleep apnea metrics. These include
    the Apnea-Hypopnea Index (AHI), different types of respiratory events (such as obstructive apneas, central apneas, and
    hypopneas), pressure levels used during therapy, and mask leak rates. By analyzing these metrics, users can identify patterns
    in their sleep data, troubleshoot issues with their therapy, and potentially optimize their CPAP settings for more effective
    treatment.
  source_topic: Increased AHI due to weight loss
