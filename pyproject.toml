[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-graph-foundry"
version = "0.4.35"
description = "Knowledge Graph Foundry - data science-informed knowledge graph construction with adaptive ontology evolution, Bayesian entity resolution, and statistical convergence detection"
authors = [
    { name = "Stellars Henson \u003ckonrad.jelen@gmail.com\u003e" },
]
readme = "README.md"
requires-python = "~=3.12.0"
classifiers = [
    "Programming Language :: Python :: 3",
]

dependencies = [
    # CLI and TUI
    "typer",
    "textual",
    # LLM integration
    "litellm",
    "instructor",
    # Agent orchestration
    "strands-agents",
    "strands-agents-tools",
    # Document parsing
    "pymupdf4llm",
    "python-docx",
    # Chunking
    "tiktoken",
    # Graph database
    "neo4j",
    # Ontology
    "owlready2",
    # Entity resolution
    "python-Levenshtein",
    "numpy",
    "faiss-cpu",
    # Calibration
    "scikit-learn",
    # Embeddings
    "boto3",
    # Configuration and validation
    "pydantic>=2.0",
    "pyyaml",
    "python-dotenv",
    # Logging
    "loguru",
    # Event system
    "blinker>=1.7",
    # Pipeline lifecycle FSM
    "transitions>=0.9",
]

[project.urls]
Homepage = "https://github.com/stellarshenson/knowledge-graph-foundry"
Repository = "https://github.com/stellarshenson/knowledge-graph-foundry"
Issues = "https://github.com/stellarshenson/knowledge-graph-foundry/issues"

[project.optional-dependencies]
dev = [
    "build",
    "ipykernel",
    "ipython",
    "nbdime",
    "pip",
    "pytest",
    "pytest-cov",
    "pytest-mock",
    "ruff",
    "awscli",
]
local-embeddings = [
    "sentence-transformers>=2.5",
]

[project.scripts]
kgf = "knowledge_graph_foundry.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["knowledge_graph_foundry*"]
exclude = ["tests*"]

[tool.ruff]
line-length = 99
src = ["knowledge_graph_foundry"]
include = ["pyproject.toml", "knowledge_graph_foundry/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["knowledge_graph_foundry"]
force-sort-within-sections = true
