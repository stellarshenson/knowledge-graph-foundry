[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kg_builder_cli"
version = "0.1.9"
description = "Knowledge Graph Builder for Neo4J DB (for now) heavily inspired by the Neo4J Graph Builder, with free or constrained ontology and straightforward execution"
authors = [
    { name = "Stellars Henson \u003ckonrad.jelen@gmail.com\u003e" },
]
readme = "README.md"
requires-python = "~=3.12.0"
classifiers = [
    "Programming Language :: Python :: 3",
]

dependencies = [
    # CLI and TUI
    "typer",
    "textual",
    # LLM integration
    "litellm",
    "instructor",
    # Agent orchestration
    "strands-agents",
    "strands-agents-tools",
    # Document parsing
    "pymupdf4llm",
    "python-docx",
    # Chunking
    "tiktoken",
    "langchain-text-splitters",
    "chonkie",
    # Graph database
    "neo4j",
    "langchain-neo4j",
    # Ontology
    "owlready2",
    # Entity resolution
    "python-Levenshtein",
    "numpy",
    # Embeddings
    "boto3",
    # Configuration and validation
    "pydantic>=2.0",
    "pyyaml",
    "python-dotenv",
    # Logging
    "loguru",
]

[project.optional-dependencies]
dev = [
    "build",
    "ipykernel",
    "ipython",
    "nbdime",
    "pip",
    "pytest",
    "pytest-cov",
    "pytest-mock",
    "ruff",
    "awscli",
]

[project.scripts]
kg = "kg_builder_cli.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["kg_builder_cli*"]
exclude = ["tests*"]

[tool.ruff]
line-length = 99
src = ["kg_builder_cli"]
include = ["pyproject.toml", "kg_builder_cli/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["kg_builder_cli"]
force-sort-within-sections = true
