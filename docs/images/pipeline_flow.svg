<!--
  pipeline_flow.svg - KGF ingestion pipeline flow diagram
  Shows: 6 pipeline stages left-to-right (Parse, Chunk, Extract, Dedup, Resolve, Load)
  connected by arrows, with 3 escalation cards below (Curing, Resolution, Deferred Dedup).
  Dashed connectors link pipeline stages to their escalation agents.
  Intent: visualize the hot pipeline path vs agent escalation points for Section 2 of KGF_DESIGN.
  Theme: Stellars-Tech derived - fg-1=#1a5a6e (light), accent-1=#0096d1, accent-2=#da8230.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 228">
  <style>
    .fg-1 { fill: #1a5a6e; }
    .fg-2 { fill: #24697e; }
    .fg-3 { fill: #236a74; }
    .fg-4 { fill: #2b7680; }
    .accent-1 { fill: #005f7a; }
    .accent-2 { fill: #7a4a15; }
    @media (prefers-color-scheme: dark) {
      .fg-1 { fill: #b8e4f0; }
      .fg-2 { fill: #8fd4e6; }
      .fg-3 { fill: #5aafc5; }
      .fg-4 { fill: #4099b3; }
      .accent-1 { fill: #5cc8e0; }
      .accent-2 { fill: #d4a04a; }
    }
  </style>

  <!-- === GRID REFERENCE ===
    viewBox: 800x228
    Pipeline row: y=20..70 (box 100x50, stride 126, first x=16)
    Arrow centres: y=45
    Escalation label: y=92
    Escalation cards: y=106, h=78, w=230, 3 cards centred (x=35,285,535)
    Legend: y=202
  === -->

  <!-- === LAYOUT TOPOLOGY ===
    h-stack: parse-box, chunk-box, extract-box, dedup-box, resolve-box, load-box
    h-stack: curing-box, type-res-box, deferred-box (escalation row)
    v-link: extract-box > curing-box
    v-link: dedup-box > type-res-box
    v-link: resolve-box > deferred-box
  === -->

  <!-- Title -->
  <text x="400" y="14" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="600" class="fg-2" text-anchor="middle" letter-spacing="1">INGESTION PIPELINE</text>

  <!-- === PIPELINE BOXES (stride 126: box 100 + gap 26) === -->

  <!-- Parse -->
  <g id="parse-box">
    <rect x="16" y="24" width="100" height="50" rx="6" fill="#0096d1" fill-opacity="0.06" stroke="#0096d1" stroke-width="1.2"/>
    <rect x="16" y="24" width="100" height="4" rx="2" fill="#0096d1" opacity="0.5"/>
    <text x="66" y="48" class="fg-1" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Parse</text>
    <text x="66" y="62" class="fg-3" font-family="Segoe UI, Arial, sans-serif" font-size="8" text-anchor="middle">PDF, TXT, JSON</text>
  </g>

  <!-- Arrow 1 -->
  <line x1="118" y1="49" x2="132" y2="49" stroke="#0096d1" stroke-width="1.5" opacity="0.3"/>
  <polygon points="132,45 140,49 132,53" fill="#0096d1" opacity="0.7"/>

  <!-- Chunk -->
  <g id="chunk-box">
    <rect x="142" y="24" width="100" height="50" rx="6" fill="#0096d1" fill-opacity="0.06" stroke="#0096d1" stroke-width="1.2"/>
    <rect x="142" y="24" width="100" height="4" rx="2" fill="#0096d1" opacity="0.5"/>
    <text x="192" y="48" class="fg-1" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Chunk</text>
    <text x="192" y="62" class="fg-3" font-family="Segoe UI, Arial, sans-serif" font-size="8" text-anchor="middle">Token windows</text>
  </g>

  <!-- Arrow 2 -->
  <line x1="244" y1="49" x2="258" y2="49" stroke="#0096d1" stroke-width="1.5" opacity="0.3"/>
  <polygon points="258,45 266,49 258,53" fill="#0096d1" opacity="0.7"/>

  <!-- Extract -->
  <g id="extract-box">
    <rect x="268" y="24" width="100" height="50" rx="6" fill="#0096d1" fill-opacity="0.06" stroke="#0096d1" stroke-width="1.2"/>
    <rect x="268" y="24" width="100" height="4" rx="2" fill="#0096d1" opacity="0.5"/>
    <text x="318" y="48" class="fg-1" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Extract</text>
    <text x="318" y="62" class="fg-3" font-family="Segoe UI, Arial, sans-serif" font-size="8" text-anchor="middle">litellm+instructor</text>
  </g>

  <!-- Arrow 3 -->
  <line x1="370" y1="49" x2="384" y2="49" stroke="#0096d1" stroke-width="1.5" opacity="0.3"/>
  <polygon points="384,45 392,49 384,53" fill="#0096d1" opacity="0.7"/>

  <!-- Dedup -->
  <g id="dedup-box">
    <rect x="394" y="24" width="100" height="50" rx="6" fill="#0096d1" fill-opacity="0.06" stroke="#0096d1" stroke-width="1.2"/>
    <rect x="394" y="24" width="100" height="4" rx="2" fill="#0096d1" opacity="0.5"/>
    <text x="444" y="48" class="fg-1" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Dedup</text>
    <text x="444" y="62" class="fg-3" font-family="Segoe UI, Arial, sans-serif" font-size="8" text-anchor="middle">Embedding + rules</text>
  </g>

  <!-- Arrow 4 -->
  <line x1="496" y1="49" x2="510" y2="49" stroke="#0096d1" stroke-width="1.5" opacity="0.3"/>
  <polygon points="510,45 518,49 510,53" fill="#0096d1" opacity="0.7"/>

  <!-- Resolve -->
  <g id="resolve-box">
    <rect x="520" y="24" width="100" height="50" rx="6" fill="#0096d1" fill-opacity="0.06" stroke="#0096d1" stroke-width="1.2"/>
    <rect x="520" y="24" width="100" height="4" rx="2" fill="#0096d1" opacity="0.5"/>
    <text x="570" y="48" class="fg-1" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Resolve</text>
    <text x="570" y="62" class="fg-3" font-family="Segoe UI, Arial, sans-serif" font-size="8" text-anchor="middle">Cross-type merge</text>
  </g>

  <!-- Arrow 5 -->
  <line x1="622" y1="49" x2="636" y2="49" stroke="#0096d1" stroke-width="1.5" opacity="0.3"/>
  <polygon points="636,45 644,49 636,53" fill="#0096d1" opacity="0.7"/>

  <!-- Load -->
  <g id="load-box">
    <rect x="646" y="24" width="100" height="50" rx="6" fill="#0096d1" fill-opacity="0.06" stroke="#0096d1" stroke-width="1.2"/>
    <rect x="646" y="24" width="100" height="4" rx="2" fill="#0096d1" opacity="0.5"/>
    <text x="696" y="48" class="fg-1" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Load</text>
    <text x="696" y="62" class="fg-3" font-family="Segoe UI, Arial, sans-serif" font-size="8" text-anchor="middle">Batch Cypher</text>
  </g>

  <!-- Neo4J target -->
  <line x1="748" y1="49" x2="762" y2="49" stroke="#0096d1" stroke-width="1.5" opacity="0.3"/>
  <polygon points="762,45 770,49 762,53" fill="#0096d1" opacity="0.7"/>
  <ellipse cx="784" cy="39" rx="12" ry="5" fill="none" stroke="#0096d1" stroke-width="1.2"/>
  <path d="M772,39 V59 A12,5 0 0 0 796,59 V39" fill="#0096d1" fill-opacity="0.06" stroke="#0096d1" stroke-width="1.2"/>
  <ellipse cx="784" cy="59" rx="12" ry="5" fill="none" stroke="#0096d1" stroke-width="1.2"/>
  <text x="784" y="52" class="fg-1" font-family="Segoe UI, Arial, sans-serif" font-size="7" text-anchor="middle">Neo4J</text>

  <!-- === ESCALATION SECTION === -->
  <text x="400" y="92" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="600" class="accent-2" text-anchor="middle" letter-spacing="1">ESCALATION AGENTS (STRANDS SDK)</text>
  <line x1="120" y1="97" x2="680" y2="97" stroke="#da8230" stroke-width="0.5" opacity="0.3"/>

  <!-- Dashed connectors: pipeline stage -> escalation card -->
  <line x1="318" y1="74" x2="150" y2="106" stroke="#da8230" stroke-width="1.2" stroke-dasharray="4,3" opacity="0.5"/>
  <polygon points="148,102 150,110 154,103" fill="#da8230" opacity="0.6"/>
  <line x1="444" y1="74" x2="400" y2="106" stroke="#da8230" stroke-width="1.2" stroke-dasharray="4,3" opacity="0.5"/>
  <polygon points="397,102 400,110 404,103" fill="#da8230" opacity="0.6"/>
  <line x1="570" y1="74" x2="650" y2="106" stroke="#da8230" stroke-width="1.2" stroke-dasharray="4,3" opacity="0.5"/>
  <polygon points="647,102 650,110 653,103" fill="#da8230" opacity="0.6"/>

  <!-- === ESCALATION CARDS (3-up, w=230, gap=20, centred) === -->

  <!-- Curing Agent -->
  <g id="curing-box">
    <rect x="35" y="106" width="230" height="78" rx="6" fill="#da8230" fill-opacity="0.06" stroke="#da8230" stroke-width="1.2"/>
    <rect x="35" y="106" width="230" height="4" rx="2" fill="#da8230" opacity="0.5"/>
    <text x="150" y="128" class="fg-1" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Curing Agent</text>
    <text x="150" y="142" class="fg-3" font-family="Segoe UI, Arial, sans-serif" font-size="8" text-anchor="middle">Metrics timeline + type frequencies</text>
    <text x="150" y="156" class="fg-4" font-family="Segoe UI, Arial, sans-serif" font-size="8" text-anchor="middle">Returns CureDecision (cure/block)</text>
    <text x="150" y="174" class="accent-2" font-family="Segoe UI, Arial, sans-serif" font-size="7" text-anchor="middle">query_graph / query_buffer / inspect_metrics</text>
  </g>

  <!-- Resolution Agent -->
  <g id="type-res-box">
    <rect x="285" y="106" width="230" height="78" rx="6" fill="#da8230" fill-opacity="0.06" stroke="#da8230" stroke-width="1.2"/>
    <rect x="285" y="106" width="230" height="4" rx="2" fill="#da8230" opacity="0.5"/>
    <text x="400" y="128" class="fg-1" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Resolution Agent</text>
    <text x="400" y="142" class="fg-3" font-family="Segoe UI, Arial, sans-serif" font-size="8" text-anchor="middle">Bayesian posterior + candidate pairs</text>
    <text x="400" y="156" class="fg-4" font-family="Segoe UI, Arial, sans-serif" font-size="8" text-anchor="middle">Returns TypeChoice / MergeDecision</text>
    <text x="400" y="174" class="accent-2" font-family="Segoe UI, Arial, sans-serif" font-size="7" text-anchor="middle">query_graph / query_buffer</text>
  </g>

  <!-- Deferred Dedup Agent -->
  <g id="deferred-box">
    <rect x="535" y="106" width="230" height="78" rx="6" fill="#da8230" fill-opacity="0.06" stroke="#da8230" stroke-width="1.2"/>
    <rect x="535" y="106" width="230" height="4" rx="2" fill="#da8230" opacity="0.5"/>
    <text x="650" y="128" class="fg-1" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Deferred Dedup</text>
    <text x="650" y="142" class="fg-3" font-family="Segoe UI, Arial, sans-serif" font-size="8" text-anchor="middle">Ambiguous zone (0.4-0.6 posterior)</text>
    <text x="650" y="156" class="fg-4" font-family="Segoe UI, Arial, sans-serif" font-size="8" text-anchor="middle">Returns CrossTypeMergeDecision</text>
    <text x="650" y="174" class="accent-2" font-family="Segoe UI, Arial, sans-serif" font-size="7" text-anchor="middle">query_graph / query_buffer</text>
  </g>

  <!-- Legend -->
  <g id="legend">
    <line x1="200" y1="214" x2="220" y2="214" stroke="#0096d1" stroke-width="1.5"/>
    <text x="224" y="217" class="fg-4" font-family="Segoe UI, Arial, sans-serif" font-size="8">Pipeline (direct litellm+instructor)</text>
    <line x1="440" y1="214" x2="460" y2="214" stroke="#da8230" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="464" y="217" class="fg-4" font-family="Segoe UI, Arial, sans-serif" font-size="8">Agent escalation (Strands SDK)</text>
  </g>

</svg>
