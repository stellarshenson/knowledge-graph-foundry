<!--
  hybrid_architecture.svg - KGF hybrid architecture overview
  Shows: three-column layout. Left: input sources (PDF, JSON, etc). Centre: pipeline
  stages stacked vertically with hot-path indicator. Right: agent engagement model
  (interactive checkpoints top, escalation points bottom) with tool registry.
  Intent: top-level architecture diagram for Section 2 of KGF_DESIGN.md.
  Theme: Stellars-Tech derived - accent-1=#0096d1 pipeline, accent-2=#da8230 agents.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <style>
    .fg-1 { fill: #1a5a6e; }
    .fg-2 { fill: #24697e; }
    .fg-3 { fill: #236a74; }
    .fg-4 { fill: #2b7680; }
    .accent-1 { fill: #005f7a; }
    .accent-2 { fill: #7a4a15; }
    @media (prefers-color-scheme: dark) {
      .fg-1 { fill: #b8e4f0; }
      .fg-2 { fill: #8fd4e6; }
      .fg-3 { fill: #5aafc5; }
      .fg-4 { fill: #4099b3; }
      .accent-1 { fill: #5cc8e0; }
      .accent-2 { fill: #d4a04a; }
    }
  </style>

  <g id="guide-grid" display="none">
    <line x1="200" y1="0" x2="200" y2="400" stroke="red" stroke-width="0.5"/>
    <line x1="540" y1="0" x2="540" y2="400" stroke="red" stroke-width="0.5"/>
  </g>

  <!-- === GRID REFERENCE ===
    viewBox: 800x400
    Left column (inputs): x=16..180
    Centre column (pipeline): x=210..530
    Right column (agents): x=560..784
    Top margin: 20px
    Vertical rhythm: 14px
  === -->

  <!-- === LAYOUT TOPOLOGY ===
    h-stack: inputs-column, pipeline-column, agents-column
    v-stack: inputs-column > input-cards
    v-stack: pipeline-column > pipeline-stages
    v-stack: agents-column > checkpoint-card, escalation-card, tools-card
  === -->

  <!-- Title -->
  <text x="400" y="16" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="600" class="fg-2" text-anchor="middle" letter-spacing="1">HYBRID ARCHITECTURE</text>

  <!-- === LEFT COLUMN: INPUT SOURCES === -->
  <g id="inputs-column">
    <text x="98" y="40" class="fg-1" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="600" text-anchor="middle" letter-spacing="1">INPUT SOURCES</text>

    <!-- Unstructured card -->
    <rect x="16" y="52" width="164" height="100" rx="6" fill="#0096d1" fill-opacity="0.05" stroke="#0096d1" stroke-width="1"/>
    <rect x="16" y="52" width="164" height="3" rx="1" fill="#0096d1" opacity="0.4"/>
    <text x="30" y="72" class="fg-2" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="600">Unstructured</text>
    <text x="30" y="88" class="fg-3" font-family="Segoe UI, Arial, sans-serif" font-size="8">PDF documents</text>
    <text x="30" y="102" class="fg-3" font-family="Segoe UI, Arial, sans-serif" font-size="8">TXT / MD files</text>
    <text x="30" y="116" class="fg-3" font-family="Segoe UI, Arial, sans-serif" font-size="8">DOCX documents</text>
    <text x="30" y="130" class="fg-4" font-family="Segoe UI, Arial, sans-serif" font-size="8">Free-form text extraction</text>
    <!-- Icon: file-text simplified -->
    <rect x="144" y="66" width="14" height="18" rx="2" fill="none" stroke="#0096d1" stroke-width="1" opacity="0.4"/>
    <line x1="148" y1="72" x2="155" y2="72" stroke="#0096d1" stroke-width="0.8" opacity="0.4"/>
    <line x1="148" y1="76" x2="155" y2="76" stroke="#0096d1" stroke-width="0.8" opacity="0.4"/>
    <line x1="148" y1="80" x2="153" y2="80" stroke="#0096d1" stroke-width="0.8" opacity="0.4"/>

    <!-- Structured card -->
    <rect x="16" y="164" width="164" height="100" rx="6" fill="#0096d1" fill-opacity="0.05" stroke="#0096d1" stroke-width="1"/>
    <rect x="16" y="164" width="164" height="3" rx="1" fill="#0096d1" opacity="0.4"/>
    <text x="30" y="184" class="fg-2" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="600">Structured</text>
    <text x="30" y="200" class="fg-3" font-family="Segoe UI, Arial, sans-serif" font-size="8">JSON records</text>
    <text x="30" y="214" class="fg-3" font-family="Segoe UI, Arial, sans-serif" font-size="8">JSONL streams</text>
    <text x="30" y="228" class="fg-4" font-family="Segoe UI, Arial, sans-serif" font-size="8">Schema inference (auto)</text>
    <text x="30" y="242" class="fg-4" font-family="Segoe UI, Arial, sans-serif" font-size="8">First-class field mapping</text>
    <!-- Icon: brackets -->
    <text x="148" y="198" font-family="Segoe UI, monospace" font-size="16" class="accent-1" opacity="0.4">{ }</text>

    <!-- Ontology seed card -->
    <rect x="16" y="276" width="164" height="76" rx="6" fill="#da8230" fill-opacity="0.05" stroke="#da8230" stroke-width="1"/>
    <rect x="16" y="276" width="164" height="3" rx="1" fill="#da8230" opacity="0.4"/>
    <text x="30" y="296" class="fg-2" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="600">Ontology Seed</text>
    <text x="30" y="312" class="fg-3" font-family="Segoe UI, Arial, sans-serif" font-size="8">OWL, YAML, JSON, MD, TXT</text>
    <text x="30" y="326" class="fg-4" font-family="Segoe UI, Arial, sans-serif" font-size="8">LLM-normalized to YAML</text>
    <text x="30" y="340" class="fg-4" font-family="Segoe UI, Arial, sans-serif" font-size="8">Optional (free extraction)</text>
  </g>

  <!-- Arrows: inputs -> pipeline -->
  <line x1="182" y1="102" x2="206" y2="102" stroke="#0096d1" stroke-width="1.2" opacity="0.3"/>
  <polygon points="206,98 214,102 206,106" fill="#0096d1" opacity="0.6"/>
  <line x1="182" y1="214" x2="206" y2="214" stroke="#0096d1" stroke-width="1.2" opacity="0.3"/>
  <polygon points="206,210 214,214 206,218" fill="#0096d1" opacity="0.6"/>
  <line x1="182" y1="314" x2="206" y2="276" stroke="#da8230" stroke-width="1.2" opacity="0.3" stroke-dasharray="4,3"/>
  <polygon points="204,272 214,276 206,280" fill="#da8230" opacity="0.6"/>

  <!-- === CENTRE COLUMN: PIPELINE === -->
  <g id="pipeline-column">
    <text x="370" y="40" class="fg-1" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="600" text-anchor="middle" letter-spacing="1">PIPELINE (HOT PATH)</text>

    <!-- Hot path indicator bar -->
    <rect x="364" y="46" width="4" height="310" rx="2" fill="#0096d1" opacity="0.15"/>

    <!-- Stage boxes - stacked vertically -->
    <g id="stage-parse">
      <rect x="216" y="56" width="300" height="36" rx="5" fill="#0096d1" fill-opacity="0.05" stroke="#0096d1" stroke-width="1"/>
      <text x="234" y="78" class="fg-1" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700">Parse + Detect</text>
      <text x="380" y="78" class="fg-4" font-family="Segoe UI, Arial, sans-serif" font-size="8">File type routing, document parsing</text>
    </g>

    <g id="stage-chunk">
      <rect x="216" y="100" width="300" height="36" rx="5" fill="#0096d1" fill-opacity="0.05" stroke="#0096d1" stroke-width="1"/>
      <text x="234" y="122" class="fg-1" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700">Chunk</text>
      <text x="380" y="122" class="fg-4" font-family="Segoe UI, Arial, sans-serif" font-size="8">Token-window splitting</text>
    </g>

    <g id="stage-extract">
      <rect x="216" y="144" width="300" height="36" rx="5" fill="#0096d1" fill-opacity="0.05" stroke="#0096d1" stroke-width="1"/>
      <text x="234" y="166" class="fg-1" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700">Extract</text>
      <text x="380" y="166" class="fg-4" font-family="Segoe UI, Arial, sans-serif" font-size="8">litellm+instructor per chunk</text>
    </g>

    <g id="stage-dedup">
      <rect x="216" y="188" width="300" height="36" rx="5" fill="#0096d1" fill-opacity="0.05" stroke="#0096d1" stroke-width="1"/>
      <text x="234" y="210" class="fg-1" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700">Dedup + Resolve</text>
      <text x="380" y="210" class="fg-4" font-family="Segoe UI, Arial, sans-serif" font-size="8">Embedding similarity, Bayesian merge</text>
    </g>

    <g id="stage-cure">
      <rect x="216" y="232" width="300" height="36" rx="5" fill="#0096d1" fill-opacity="0.05" stroke="#0096d1" stroke-width="1"/>
      <text x="234" y="254" class="fg-1" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700">Ontology Buffer</text>
      <text x="380" y="254" class="fg-4" font-family="Segoe UI, Arial, sans-serif" font-size="8">Type frequencies, curing, clustering</text>
    </g>

    <g id="stage-load">
      <rect x="216" y="276" width="300" height="36" rx="5" fill="#0096d1" fill-opacity="0.05" stroke="#0096d1" stroke-width="1"/>
      <text x="234" y="298" class="fg-1" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700">Load + Validate</text>
      <text x="380" y="298" class="fg-4" font-family="Segoe UI, Arial, sans-serif" font-size="8">Batch Cypher, dual indexing</text>
    </g>

    <!-- Down arrows between stages -->
    <line x1="366" y1="92" x2="366" y2="100" stroke="#0096d1" stroke-width="1" opacity="0.3"/>
    <line x1="366" y1="136" x2="366" y2="144" stroke="#0096d1" stroke-width="1" opacity="0.3"/>
    <line x1="366" y1="180" x2="366" y2="188" stroke="#0096d1" stroke-width="1" opacity="0.3"/>
    <line x1="366" y1="224" x2="366" y2="232" stroke="#0096d1" stroke-width="1" opacity="0.3"/>
    <line x1="366" y1="268" x2="366" y2="276" stroke="#0096d1" stroke-width="1" opacity="0.3"/>

    <!-- Neo4J target -->
    <line x1="366" y1="312" x2="366" y2="326" stroke="#0096d1" stroke-width="1" opacity="0.3"/>
    <polygon points="362,326 366,334 370,326" fill="#0096d1" opacity="0.5"/>
    <ellipse cx="366" cy="342" rx="30" ry="8" fill="#0096d1" fill-opacity="0.06" stroke="#0096d1" stroke-width="1"/>
    <path d="M336,342 V362 A30,8 0 0 0 396,362 V342" fill="#0096d1" fill-opacity="0.04" stroke="#0096d1" stroke-width="1"/>
    <ellipse cx="366" cy="362" rx="30" ry="8" fill="none" stroke="#0096d1" stroke-width="1"/>
    <text x="366" y="356" class="fg-1" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="600" text-anchor="middle">Neo4J</text>
  </g>

  <!-- === RIGHT COLUMN: AGENT ENGAGEMENT === -->
  <g id="agents-column">
    <text x="672" y="40" class="fg-2" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="600" text-anchor="middle" letter-spacing="1">AGENT ENGAGEMENT</text>

    <!-- Interactive checkpoints -->
    <rect x="560" y="52" width="224" height="110" rx="6" fill="#da8230" fill-opacity="0.05" stroke="#da8230" stroke-width="1"/>
    <rect x="560" y="52" width="224" height="3" rx="1" fill="#da8230" opacity="0.4"/>
    <text x="574" y="72" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="600" class="accent-2">Interactive Checkpoints</text>
    <text x="574" y="88" class="fg-3" font-family="Segoe UI, Arial, sans-serif" font-size="8">Schema inference proposal</text>
    <text x="574" y="102" class="fg-3" font-family="Segoe UI, Arial, sans-serif" font-size="8">Ontology normalization</text>
    <text x="574" y="116" class="fg-3" font-family="Segoe UI, Arial, sans-serif" font-size="8">Buffer refinement review</text>
    <text x="574" y="130" class="fg-3" font-family="Segoe UI, Arial, sans-serif" font-size="8">Migration plan approval</text>
    <text x="574" y="148" class="fg-4" font-family="Segoe UI, Arial, sans-serif" font-size="7">Skipped in --batch mode (autonomous)</text>

    <!-- Escalation points -->
    <rect x="560" y="176" width="224" height="110" rx="6" fill="#da8230" fill-opacity="0.05" stroke="#da8230" stroke-width="1"/>
    <rect x="560" y="176" width="224" height="3" rx="1" fill="#da8230" opacity="0.4"/>
    <text x="574" y="196" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="600" class="accent-2">Escalation Points</text>
    <text x="574" y="212" class="fg-3" font-family="Segoe UI, Arial, sans-serif" font-size="8">Curing Agent - CureDecision</text>
    <text x="574" y="226" class="fg-3" font-family="Segoe UI, Arial, sans-serif" font-size="8">Resolution Agent - TypeChoice</text>
    <text x="574" y="240" class="fg-3" font-family="Segoe UI, Arial, sans-serif" font-size="8">Deferred Dedup - MergeDecision</text>
    <text x="574" y="258" class="fg-4" font-family="Segoe UI, Arial, sans-serif" font-size="7">Read-only context, structured return</text>
    <text x="574" y="272" class="fg-4" font-family="Segoe UI, Arial, sans-serif" font-size="7">No pipeline state mutation</text>

    <!-- Tool registry -->
    <rect x="560" y="298" width="224" height="68" rx="6" fill="#0096d1" fill-opacity="0.05" stroke="#0096d1" stroke-width="1"/>
    <rect x="560" y="298" width="224" height="3" rx="1" fill="#0096d1" opacity="0.4"/>
    <text x="574" y="318" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="600" class="accent-1">Tool Registry</text>
    <text x="574" y="334" class="fg-3" font-family="Segoe UI, Arial, sans-serif" font-size="8">query_graph - Neo4J read</text>
    <text x="574" y="348" class="fg-3" font-family="Segoe UI, Arial, sans-serif" font-size="8">query_buffer - OntologyState</text>
    <text x="574" y="362" class="fg-3" font-family="Segoe UI, Arial, sans-serif" font-size="8">inspect_metrics - Stability history</text>
  </g>

  <!-- Connector arrows: pipeline -> agents -->
  <line x1="518" y1="74" x2="556" y2="74" stroke="#da8230" stroke-width="1" stroke-dasharray="3,2" opacity="0.4"/>
  <polygon points="556,71 562,74 556,77" fill="#da8230" opacity="0.5"/>
  <line x1="518" y1="250" x2="556" y2="230" stroke="#da8230" stroke-width="1" stroke-dasharray="3,2" opacity="0.4"/>
  <polygon points="554,227 562,228 556,233" fill="#da8230" opacity="0.5"/>

  <!-- Legend -->
  <g id="legend">
    <rect x="16" y="376" width="8" height="8" rx="1" fill="#0096d1" fill-opacity="0.06" stroke="#0096d1" stroke-width="1"/>
    <text x="28" y="384" class="fg-4" font-family="Segoe UI, Arial, sans-serif" font-size="7">Pipeline (direct litellm+instructor)</text>
    <rect x="200" y="376" width="8" height="8" rx="1" fill="#da8230" fill-opacity="0.06" stroke="#da8230" stroke-width="1"/>
    <text x="212" y="384" class="fg-4" font-family="Segoe UI, Arial, sans-serif" font-size="7">Agent engagement (Strands SDK)</text>
    <line x1="400" y1="380" x2="420" y2="380" stroke="#da8230" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="424" y="384" class="fg-4" font-family="Segoe UI, Arial, sans-serif" font-size="7">Escalation (structured decision return)</text>
  </g>

</svg>
